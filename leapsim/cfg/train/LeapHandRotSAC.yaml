#
# Soft Actor-Critic. The `sac` algo, `soft_actor_critic` model and network, and
# the SAC player all ship with rl_games (see torch_runner.py) -- no local code
# is required, only this config. SAC is off-policy, so unlike the PPO config it
# uses a plain MLP (no RNN / central value / value normalization).

params:
  seed: ${...seed}

  algo:
    name: sac

  model:
    name: soft_actor_critic

  network:
    name: soft_actor_critic
    separate: True

    space:
      continuous:

    mlp:
      units: [512, 256, 128]
      activation: relu
      d2rl: False

      initializer:
        name: default

    log_std_bounds: [-5, 2]

  load_checkpoint: ${if:${...checkpoint},True,False} # flag which sets whether to load the checkpoint
  load_path: ${...checkpoint} # path to the checkpoint to load

  config:
    name: ${resolve_default:LeapHand,${....experiment}}
    full_experiment_name: ${.name}
    train_dir: ${....runs_dir}
    env_name: rlgpu
    device: ${....rl_device}
    normalize_input: True
    reward_shaper:
      scale_value: 0.01
    max_epochs: ${resolve_default:5000,${....max_iterations}}
    num_steps_per_episode: 8
    save_best_after: 100
    save_frequency: 200
    print_stats: True
    gamma: 0.99
    init_alpha: 1.0
    alpha_lr: 5e-4
    actor_lr: 5e-4
    critic_lr: 5e-4
    critic_tau: 0.005
    batch_size: 4096
    learnable_temperature: True
    num_warmup_steps: 10 # epochs of random exploration before learning starts
    replay_buffer_size: 1000000
    num_actors: ${....task.env.numEnvs}

    player:
      deterministic: True
      games_num: 100000
      print_stats: True
