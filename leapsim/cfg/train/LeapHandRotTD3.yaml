#
# Twin Delayed DDPG (TD3). rl_games does not ship TD3, so the `td3` algo, model
# and network are implemented locally in leapsim/learning/ and registered in
# runner.py (CustomRunner). Off-policy, plain-MLP (no RNN / central value).

params:
  seed: ${...seed}

  algo:
    name: td3

  model:
    name: td3

  network:
    name: td3
    separate: True

    space:
      continuous:

    mlp:
      units: [512, 256, 128]
      activation: relu
      d2rl: False

      initializer:
        name: default

  load_checkpoint: ${if:${...checkpoint},True,False} # flag which sets whether to load the checkpoint
  load_path: ${...checkpoint} # path to the checkpoint to load

  config:
    name: ${resolve_default:LeapHand,${....experiment}}
    full_experiment_name: ${.name}
    train_dir: ${....runs_dir}
    env_name: rlgpu
    device: ${....rl_device}
    normalize_input: True
    reward_shaper:
      scale_value: 0.01
    max_epochs: ${resolve_default:5000,${....max_iterations}}
    num_steps_per_episode: 8
    save_best_after: 100
    save_frequency: 200
    print_stats: True
    gamma: 0.99
    actor_lr: 5e-4
    critic_lr: 5e-4
    critic_tau: 0.005
    actor_tau: 0.005
    batch_size: 4096
    num_warmup_steps: 10 # epochs of random exploration before learning starts
    replay_buffer_size: 1000000
    num_actors: ${....task.env.numEnvs}

    # TD3-specific
    expl_noise: 0.1     # std of Gaussian exploration noise added during collection
    policy_noise: 0.2   # std of target-policy smoothing noise
    noise_clip: 0.5     # clip range for the smoothing noise
    policy_freq: 2      # delayed policy/target update every N critic updates

    player:
      deterministic: True
      games_num: 100000
      print_stats: True
